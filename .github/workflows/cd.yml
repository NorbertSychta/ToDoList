name: CD - Build and Push Images (GHCR)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Image Tag (short SHA)
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        run: |
          docker build -t ghcr.io/norbertsychta/todo-frontend:${{ steps.vars.outputs.tag }} ./frontend
          docker push ghcr.io/norbertsychta/todo-frontend:${{ steps.vars.outputs.tag }}

          docker build -t ghcr.io/norbertsychta/todo-frontend:latest ./frontend
          docker push ghcr.io/norbertsychta/todo-frontend:latest

      - name: Build & Push Backend Image
        run: |
          docker build -t ghcr.io/norbertsychta/todo-backend:${{ steps.vars.outputs.tag }} ./backend
          docker push ghcr.io/norbertsychta/todo-backend:${{ steps.vars.outputs.tag }}

          docker build -t ghcr.io/norbertsychta/todo-backend:latest ./backend
          docker push ghcr.io/norbertsychta/todo-backend:latest
