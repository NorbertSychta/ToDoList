name: CI - Quality Control

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Lint
        run: |
          cd frontend
          npm install
          npm run lint

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Lint
        run: |
          cd backend
          pip install flake8
          # Flake8 sprawdza błędy w składni Pythona
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Stack
        run: docker-compose build