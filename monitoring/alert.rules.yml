groups:
  - name: todolist-alerts
    rules:
      - alert: HighHttpRequestRate
        expr: sum(rate(http_requests_total[1m])) > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Wysoki rate requestów HTTP"
          description: "Suma requestów/s > 5 przez 30 sekund."
